[package]
name = "velox-dom"
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Virtual DOM and layout engine for the Velox UI framework"
readme = "README.md"
authors = ["fahimaloy"]
repository = "https://github.com/fahimaloy/velox"
documentation = "https://velox.dev/docs/dom"
keywords = ["virtual-dom", "layout", "flexbox", "ui", "framework"]
categories = ["gui"]

[features]
# Headless pixel proofs for layout live in `tests/`. They need the renderer's
# Skia backend, which is heavy, so they stay behind a feature and are opt-in:
#   cargo test -p velox-dom --features skia-native
# Everything else in `tests/` runs by default with no features.

[dependencies]

[dev-dependencies]
# Two DOM-side integration tests (`ua_defaults_live`, `button_single_child_justify`)
# assert the pairing DOM-types + CSS-cascade end to end, so they need velox-style.
# PATH-ONLY on purpose: velox-style normal-depends on velox-dom, so velox-dom must
# publish first and a `version` here would deadlock publishing (cargo's own help:
# remove the version so it is implicitly stripped). Cargo drops version-less
# dev-dependencies from the published manifest; only workspace builds see it.
velox-style = { path = "../velox-style" }

