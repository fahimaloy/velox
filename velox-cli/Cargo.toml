
[package]
name = "velox-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tools for building Velox applications"
authors = ["fahimaloy"]
license = "MIT"
repository = "https://github.com/fahimaloy/velox"
homepage = "https://velox.dev"
publish = false

[[bin]]
name = "velox"
path = "src/bin/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.11"
velox-sfc = { path = "../velox-sfc" }
velox-style = { path = "../velox-style" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
velox-renderer = { version = "0.1.0", path = "../velox-renderer" }

[lib]
name = "velox_cli"
path = "src/lib.rs"

[dev-dependencies]
# Integration tests assert on styled vnodes (`Props`/`VNode`/`h`) and drive the
# real layout pass, so they need velox-dom directly rather than through
# velox-style's re-exports.
velox-dom = { path = "../velox-dom" }
# `skia-native` is enabled here (not just for a separate CI job) so the
# pixel-level scoping proof runs in the DEFAULT `cargo test` pass rather than
# behind `#[ignore]`, which is how the unscoped-merge defect survived a green
# suite. It is a dev-dependency, so it never reaches a scaffolded app.
velox-renderer = { path = "../velox-renderer", features = ["skia-native"] }
