[package]
name = "velox-example-task-board"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fahimaloy/velox"
description = "Example app for Velox UI framework"

[[bin]]
name = "velox-example-task-board"
path = "src/main.rs"

[dependencies]
velox-core = { path = "../../velox-core" }
velox-dom = { path = "../../velox-dom" }
velox-style = { path = "../../velox-style" }
velox-renderer = { path = "../../velox-renderer", features = ["skia-native"] }

[build-dependencies]
veloxc = { path = "../../veloxc" }
