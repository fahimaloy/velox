[package]
name = "velox-example-todo"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fahimaloy/velox"
description = "Todo app example: components, computed filters and scrolling list for the Velox UI framework"

[[bin]]
name = "todo"
path = "src/main.rs"

[dependencies]
velox-core = { path = "../../velox-core" }
velox-dom = { path = "../../velox-dom" }
velox-style = { path = "../../velox-style" }
velox-renderer = { path = "../../velox-renderer", features = ["skia-native"] }

[build-dependencies]
veloxc = { path = "../../veloxc" }
