[package]
name = "velox-example-showcase"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fahimaloy/velox"
description = "Layout showcase example: spacing, flex, centering, scrolling, text alignment and wrapping for the Velox UI framework"

[[bin]]
name = "showcase"
path = "src/main.rs"

[dependencies]
velox-core = { path = "../../velox-core" }
velox-dom = { path = "../../velox-dom" }
velox-style = { path = "../../velox-style" }
velox-renderer = { path = "../../velox-renderer", features = ["skia-native"] }

[build-dependencies]
veloxc = { path = "../../veloxc" }
